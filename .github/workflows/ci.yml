# The fast loop in the pinned image with the network off (E-021): what passes here is what a clean
# clone builds offline. Run by hand only (E-024): GitHub's minutes are scarce and reserved for what
# a local machine cannot do, so no push or pull request starts a run. The gate before a push is
# scripts/prepush.sh, which runs the same loop locally.
name: ci
on:
  workflow_dispatch:
jobs:
  fast-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t evaluator .
      - name: Build and test, network off
        run: docker run --rm --network none -u "$(id -u)" -v "$PWD":/evaluator evaluator gradle build --offline --warning-mode fail
