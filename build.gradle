// Employee Evaluator's build: Java 21, offline, every dependency a file under third_party/ (E-021).
// No repository is declared, so nothing can reach the network; a new dependency is vendored first.
plugins {
    id 'java'
}

// The image pins Gradle (Dockerfile); a different Gradle outside it is refused, not tolerated.
if (gradle.gradleVersion != '8.14.3') {
    throw new GradleException("Employee Evaluator builds with Gradle 8.14.3 (the Dockerfile's image); this is ${gradle.gradleVersion}")
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

// The kernel's modules are the folders docs/modules.json names (the list lives only there).
def modules = new groovy.json.JsonSlurper().parse(file('docs/modules.json')).modules.keySet()

sourceSets {
    main {
        java.srcDirs = modules.collect { it }
    }
    // The project's own tooling: the kernel map and the metrics. Never shipped.
    scripts {
        java.srcDirs = ['scripts']
        // Counted by the kernel's own rules where the two measure the same thing (Scan.paths, E-030).
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
    // The doc tests (default package) and each module's tests (its package). The fixtures are
    // repositories to read, not our code: their Java is never compiled.
    test {
        java.srcDirs = ['test']
        java.exclude 'fixtures/**'
        compileClasspath += scripts.output
        runtimeClasspath += scripts.output
    }
}

dependencies {
    // tree-sitter and its grammars, for analyze/'s TypeScript and Python adapters (E-028).
    implementation fileTree(dir: 'third_party/tree-sitter', include: '*.jar')
    testImplementation fileTree(dir: 'third_party/junit', include: '*.jar')
}

test {
    useJUnitPlatform()
    systemProperty 'evaluator.root', rootDir.absolutePath
    // `gradle test -PwriteGoldens` rewrites the goldens under test/goldens/ instead of comparing (E-018); review the diff.
    systemProperty 'evaluator.writeGoldens', project.hasProperty('writeGoldens')
    // `gradle test -PshowGoldens` writes nothing: a golden that differs fails with its changed lines in the message, to be read
    // before `-PwriteGoldens` (E-077). The two together are refused: one run either writes or shows.
    systemProperty 'evaluator.showGoldens', project.hasProperty('showGoldens')
    if (project.hasProperty('writeGoldens') && project.hasProperty('showGoldens')) {
        throw new GradleException('-PwriteGoldens and -PshowGoldens together: show first, read the diff, then write (E-077)')
    }
    // `gradle test -Pdocker` also runs the run fixtures in the real sandbox (sandbox/setup.sh first, E-037).
    systemProperty 'evaluator.docker', project.hasProperty('docker')
    // Test classes run side by side, the tests inside a class one after another (J-088). Every test works in its own
    // temporary folders, ports and objects; a run that writes the goldens in place, or runs the real sandbox, stays serial.
    if (!project.hasProperty('writeGoldens') && !project.hasProperty('docker')) {
        systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
        systemProperty 'junit.jupiter.execution.parallel.mode.default', 'same_thread'
        systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'concurrent'
    }
    testLogging { events 'failed'; exceptionFormat = 'full' }
    // The doc tests read docs, fixtures, goldens and the repository itself, none of them the task's inputs: a
    // docs-only change would pass unrun (J-045). The loop takes seconds, so it always runs.
    outputs.upToDateWhen { false }
}

// `gradle mutate` runs PIT over the kernel's module tests (E-019): `-Ptarget=evaluator.score.*` narrows it to one
// module, its tests the same package. The doc tests (default package) hold docs, not code, and are not mutated.
// Its report goes to build/mutation/; what survives gets a test or a line in docs/MUTATION.md.
tasks.register('mutate', JavaExec) {
    description = 'Mutation testing with the vendored PIT (E-019); -Ptarget=evaluator.<module>.* narrows it.'
    dependsOn 'testClasses'
    def target = project.findProperty('target') ?: 'evaluator.*'
    // The tests share the kernel's packages: every class compiled from test/ is left unmutated.
    def ours = fileTree(dir: 'test', include: 'evaluator/**/*.java').collect {
        file('test').toPath().relativize(it.toPath()).toString().replace('.java', '').replace('/', '.') + '*'
    }
    classpath = sourceSets.test.runtimeClasspath + files(fileTree(dir: 'third_party/pitest', include: '*.jar'))
    mainClass = 'org.pitest.mutationtest.commandline.MutationCoverageReport'
    args '--reportDir', layout.buildDirectory.dir('mutation').get().asFile.path, '--timestampedReports=false',
            '--targetClasses', target, '--targetTests', target, '--excludedClasses', ours.join(','), '--outputFormats', 'CSV,XML,HTML',
            '--sourceDirs', 'rubric,ingest,analyze,history,github,score,cli', '--threads', '4',
            '--jvmArgs', "-Devaluator.root=${rootDir.absolutePath}"
    systemProperty 'evaluator.root', rootDir.absolutePath
}

tasks.register('metrics', JavaExec) {
    description = 'Prints the metrics of docs/AGENT.md and the warnings: long or branching functions, Unsure lines, the tithe cadence.'
    classpath = sourceSets.scripts.runtimeClasspath
    mainClass = 'Metrics'
    systemProperty 'evaluator.root', rootDir.absolutePath
}

tasks.register('scoreItems', JavaExec) {
    description = 'Scores each open TODO.md item from facts, with no model, and places it in a tier (token posture step 3, E-094).'
    classpath = sourceSets.scripts.runtimeClasspath
    mainClass = 'ScoreItems'
    systemProperty 'evaluator.root', rootDir.absolutePath
}

tasks.register('titheGate', JavaExec) {
    description = 'Refuses a push past sixteen commits without a tithe (E-015); scripts/prepush.sh runs it.'
    classpath = sourceSets.scripts.runtimeClasspath
    mainClass = 'TitheGate'
    systemProperty 'evaluator.root', rootDir.absolutePath
}

tasks.register('decisionsDoc', JavaExec) {
    description = 'Writes docs/DECISIONS.md, one line per decision, from theGhost.md; never edit it by hand.'
    classpath = sourceSets.scripts.runtimeClasspath
    mainClass = 'DecisionsDoc'
    systemProperty 'evaluator.root', rootDir.absolutePath
}

tasks.register('modulesDoc', JavaExec) {
    description = 'Writes docs/MODULES.md from docs/modules.json; never edit the Markdown by hand.'
    classpath = sourceSets.scripts.runtimeClasspath
    mainClass = 'ModulesDoc'
    systemProperty 'evaluator.root', rootDir.absolutePath
}

tasks.register('kernelMap', JavaExec) {
    description = 'Appends to docs/KERNEL-MAP.md a row for every function in a module it does not hold.'
    classpath = sourceSets.scripts.runtimeClasspath
    mainClass = 'KernelMap'
    systemProperty 'evaluator.root', rootDir.absolutePath
}

jar {
    manifest { attributes 'Main-Class': 'evaluator.cli.Main' }
}
